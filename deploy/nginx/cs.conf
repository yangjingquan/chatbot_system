# cs.nexbyte.top —— 智行客服（由 Jenkins 任务 cs.nexbyte.top 维护，加载于 shop-nginx 的 443）
# 底线：只操作 chatbot 自己的资源（/opt/chatbot、compose 项目 chatbot、cs.conf），不碰 shop/erp/workbench/www/ai-kb/jenkins
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name cs.nexbyte.top;

    ssl_certificate     /etc/nginx/ssl/cs.nexbyte.top.pem;
    ssl_certificate_key /etc/nginx/ssl/cs.nexbyte.top.key;

    client_max_body_size 55m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # chatbot web 绑定 127.0.0.1:18086；shop-nginx 无 host.docker.internal，沿用 erp/www 的宿主机 IP 反代
        proxy_pass http://103.47.83.185:18086;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # 流式回复 / WebSocket 接待台
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
