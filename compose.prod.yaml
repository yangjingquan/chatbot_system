# Production-oriented overlay. Does not enable TLS by itself.
# Usage:
#   1. Set PUBLIC_ORIGIN / COOKIE_SECURE / secrets in .env
#   2. Place certificates and use deploy/nginx-tls.conf.example in front of `web`
#      or terminate TLS at a cloud load balancer that forwards to web.
#   3. docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# WARNING: Do not publish db/redis ports. Keep backend reachable only via the web/proxy hop.
name: ${COMPOSE_PROJECT_NAME:-zhixing_support}
services:
  backend:
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to https://your-support-host}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    volumes:
      - ${PHYSICAL_BACKUP_HOST_DIR:-/opt/chatbot/backups}:/host-backups:ro
  worker:
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to https://your-support-host}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
  alert-monitor:
    volumes:
      - ${PHYSICAL_BACKUP_HOST_DIR:-/opt/chatbot/backups}:/host-backups:ro
  # web ports live only in compose.yaml (${WEB_BIND}:${WEB_PORT}:80).
  # Compose merges ports by appending; a second ports list here would bind twice and fail.
