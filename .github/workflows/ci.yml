# Continuous integration for zhixing chatbot_system.
# No production secrets: tests use SQLite fixtures and empty DeepSeek key.
name: ci

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:

jobs:
  backend:
    name: backend-pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Core gate (API / permissions / chat / trial / knowledge / schema)
        run: >
          pytest -q
          tests/test_api.py
          tests/test_permissions.py
          tests/test_access_control.py
          tests/test_stream_concurrency.py
          tests/test_privacy.py
          tests/test_document_lifecycle.py
          tests/test_knowledge_maintenance.py
          tests/test_reception.py
          tests/test_reception_workbench.py
          tests/test_trial_lead_chain.py
          tests/test_schema_migrations.py
      - name: Full backend suite
        run: pytest -q

  frontend:
    name: frontend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
