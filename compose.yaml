name: ${COMPOSE_PROJECT_NAME:-zhixing_support}
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: zhixing
      POSTGRES_USER: zhixing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/bootstrap.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U zhixing -d zhixing]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://zhixing:${POSTGRES_PASSWORD}@db:5432/zhixing
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@zhixing.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run bootstrap first}
      SESSION_SECRET: ${SESSION_SECRET:?Run bootstrap first}
      CONTACT_SECRET: ${CONTACT_SECRET:-}
      CONTACT_SECRET_PREVIOUS: ${CONTACT_SECRET_PREVIOUS:-}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      KNOWLEDGE_DIR: /knowledge_base
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      DATA_DIR: /data
    volumes:
      - ./knowledge_base:/knowledge_base:ro
      - app_data:/data
      - model_cache:/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
  worker:
    build: ./backend
    command: [python, -m, app.worker]
    environment: *backend_environment
    volumes:
      - app_data:/data
      - model_cache:/models
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-18080}:80
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  app_data:
  model_cache:
